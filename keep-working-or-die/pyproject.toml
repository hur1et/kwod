[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kwod"
version = "0.1.0.dev1"
description = "KEEP WORKING OR DIE persistent development core"
requires-python = ">=3.12"
dependencies = ["openai==3.13.0", "fastapi==0.141.1", "uvicorn==0.53.0", "httpx==0.28.1"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
kwod = "kwod.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kwod = ["migrations/*.sql", "static/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
